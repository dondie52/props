# Deploy GitHub Pages
#
# PropManage BW is a Next.js App Router app with middleware, server actions,
# and API routes. Production hosting is Vercel (see README). Static export to
# GitHub Pages is not supported and previously broke CI by deleting routes
# that other modules still import.
#
# This workflow is kept for manual smoke checks only and does not deploy.

name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skip-static-export:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deploy target
        run: |
          echo "GitHub Pages static export is disabled for this app."
          echo "Deploy via Vercel with NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY."
